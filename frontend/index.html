    <!-- Anti-flash script cho Google Translate -->
    <script>
      (function() {
        var match = document.cookie.match(/(?:^|;)\s*googtrans=([^;]*)/);
        if (match && match[1] && match[1] !== '/vi/vi' && match[1] !== 'auto/vi') {
          document.write('<style id="gt-anti-flash">body { opacity: 0 !important; transition: opacity 0.3s; }</style>');
          // Timeout dự phòng nếu Google Translate mất quá lâu hoặc lỗi
          setTimeout(function() {
            var el = document.getElementById('gt-anti-flash');
            if (el) el.remove();
            document.body.style.opacity = '1';
          }, 1500);
        }
      })();
    </script>
