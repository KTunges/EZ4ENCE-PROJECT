# ============================================================
# CD Pipeline - Deploy Frontend lên GitHub Pages
# Tự động deploy khi CI pass trên branch main
# ============================================================

name: "🚀 CD - Deploy Frontend"

on:
  # Chỉ chạy khi CI workflow thành công trên branch main
  workflow_run:
    workflows: ["🔍 CI - Lint & Test"]
    branches: [main]
    types:
      - completed

# Quyền để deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép 1 deployment chạy tại 1 thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: "🌐 Deploy to GitHub Pages"
    runs-on: ubuntu-latest

    # Chỉ deploy nếu CI workflow THÀNH CÔNG
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Cài đặt thư viện
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Frontend cho Production
        working-directory: ./frontend
        env:
          # Đặt base URL cho GitHub Pages (thay <repo-name> bằng tên repo thật)
          # Ví dụ: nếu repo là EZ4ENCE-PROJECT thì base = /EZ4ENCE-PROJECT/
          VITE_BASE_URL: /EZ4ENCE-PROJECT/
        run: npm run build

      - name: 📄 Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./frontend/dist"

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Thông báo kết quả
        run: |
          echo "🎉 Deploy thành công!"
          echo "🌐 URL: ${{ steps.deployment.outputs.page_url }}"
