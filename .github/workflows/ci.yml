# ============================================================
# CI Pipeline - EZ4ENCE Project
# Tự động kiểm tra code khi push hoặc tạo Pull Request
# ============================================================

name: "🔍 CI - Lint & Test"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Hủy các workflow cũ đang chạy nếu có commit mới push lên cùng branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # JOB 1: Kiểm tra Backend (Python + FastAPI)
  # ============================================
  backend:
    name: "🐍 Backend - Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Cài đặt thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Kiểm tra cú pháp Python (Syntax Check)
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/config.py
          python -m py_compile app/database.py
          echo "✅ Tất cả file Python đều hợp lệ!"

      - name: 🧪 Chạy Unit Tests (Pytest)
        env:
          # Sử dụng SQLite in-memory cho CI (không cần PostgreSQL)
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET: "ci-test-secret-key"
          JWT_EXPIRATION: "7d"
        run: |
          pytest --tb=short -v

  # ============================================
  # JOB 2: Kiểm tra Frontend (React + Vite)
  # ============================================
  frontend:
    name: "⚛️ Frontend - Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Cài đặt thư viện
        run: npm ci

      - name: 🔍 Chạy ESLint (Kiểm tra code style)
        run: npm run lint

      - name: 🏗️ Build kiểm tra (đảm bảo code không lỗi)
        run: npm run build

      - name: 📊 Kiểm tra kích thước build
        run: |
          echo "📦 Kích thước thư mục build:"
          du -sh dist/
          echo ""
          echo "📄 Chi tiết các file:"
          find dist/ -type f -exec du -h {} + | sort -rh | head -20
